name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint-tf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set tool versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          postfix: _TOOL_VERSION

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_TOOL_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_TOOL_VERSION }}

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # zizmor's five online audits skip silently without a token, and its
          # summary line reads the same either way, so CI would look green with
          # the supply-chain audits never having run.
          GH_TOKEN: ${{ github.token }}

  lint-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          fail-on-diff: true

  validate-min-terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # terraform-min-max picks the constraint file by shortest filename, not by
      # a canonical name, so a second required_version anywhere in the module
      # would silently change which floor CI validates against.
      - name: Assert a single declared floor
        run: |
          files=$(grep -rlE '^[[:space:]]*required_version[[:space:]]*=' --include='*.tf' . | sed 's|^\./||' | sort)
          if [ "$files" != "provider.tf" ]; then
            echo "expected exactly one required_version, in ./provider.tf; found:"
            printf '%s\n' "$files"
            exit 1
          fi

      # The floor is read out of required_version rather than written here, so
      # that editing the constraint moves what CI tests in the same commit.
      - name: Read the declared Terraform floor
        id: min-max
        uses: clowdhaus/terraform-min-max@5e40f8cf535d84fbd031571abd363ffd81dbfbfc # v3.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.min-max.outputs.minVersion }}

      # The lint job validates at the pinned .tool-versions release. This run
      # validates at the declared floor, so that whenever the two differ the
      # bottom of the constraint is covered too.
      - name: Validate at the declared floor
        run: |
          terraform init -backend=false
          terraform validate
