name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint-tf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set tool versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          postfix: _TOOL_VERSION

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_TOOL_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_TOOL_VERSION }}

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # zizmor's five online audits skip silently without a token, and its
          # summary line reads the same either way, so CI would look green with
          # the supply-chain audits never having run.
          GH_TOKEN: ${{ github.token }}

  lint-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          # Without this the action ignores .terraform-docs.yml and runs its own
          # defaults, so CI would check the docs against a different
          # configuration than `just docs` generates them with.
          config-file: .terraform-docs.yml
          fail-on-diff: true

  validate-min-terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The floor is read out of required_version rather than written here, so
      # that editing the constraint moves what CI tests in the same commit.
      # terraform-docs parses the configuration instead of matching a regex
      # against one file, so it reports every required_version in the module,
      # including one in a .tf.json or split across lines. The image is pinned
      # by digest because terraform-docs publishes no immutable releases, which
      # leaves both a tag and a release checksum able to change underneath us.
      # This digest is terraform-docs 0.20.0, the version in .tool-versions.
      - name: Read the declared Terraform floor
        id: floor
        run: |
          constraints=$(docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/wd" -w /wd \
            quay.io/terraform-docs/terraform-docs@sha256:37329e2dc2518e7f719a986a3954b10771c3fe000f50f83fd4d98d489df2eae2 \
            json . --output-file '' 2>/dev/null \
            | jq -r '.requirements[] | select(.name == "terraform") | .version')
          if [ -z "$constraints" ]; then
            echo "this module declares no required_version" >&2
            exit 1
          fi
          # Terraform applies every required_version in the module at once, so
          # the effective floor is the highest lower bound among them. Only >=
          # and ~> state that bound literally. Resolving anything else needs the
          # release list, so reject it rather than guess at it.
          floor=$(printf '%s\n' "$constraints" \
            | grep -oE '(>=|~>)[[:space:]]*[0-9]+\.[0-9]+(\.[0-9]+)?' \
            | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
            | awk -F. 'NF==2 {print $0".0"; next} {print}' \
            | sort -V | tail -1) || true
          if [ -z "$floor" ]; then
            echo "required_version must state a lower bound with >= or ~>; found:" >&2
            printf '  %s\n' "$constraints" >&2
            exit 1
          fi
          echo "version=$floor" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.floor.outputs.version }}

      # The lint job validates at the pinned .tool-versions release. This run
      # validates at the declared floor, so that whenever the two differ the
      # bottom of the constraint is covered too.
      - name: Validate at the declared floor
        run: |
          terraform init -backend=false
          terraform validate
